name: Deploy to Azure Container Apps

# Manual only, deliberately. A push-triggered deploy on a project with one shared Atlas cluster and
# no staging/production split is a foot-gun; wire this to `push: branches: [main]` once
# docs/deployment.md's "Before this is production" list is actually done.
#
# No step in this workflow requires a human to run a CLI command by hand: Terraform provisions
# this environment's resource group, deploy identity and secrets store, then azd/Aspire's own
# publisher provisions and deploys the application resource graph — both non-interactively,
# both authenticated via the same GitHub OIDC federated credential. The only human action left
# is the one-time-per-subscription infra/terraform/bootstrap apply (see docs/deployment.md) and
# the one-time-per-new-environment apply that creates that environment's own deploy identity
# (chicken-and-egg: an identity that doesn't exist yet can't authenticate the run that creates
# it — see docs/deployment.md's "One-time subscription bootstrap" section).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name (matches the GitHub Environment and the azd environment name, e.g. staging)"
        required: true
        default: staging
      provision:
        description: "Run azd provision (infrastructure) as well as deploy. REQUIRED on an environment's first ever run — azd deploy has nothing to deploy to until provision has created it."
        type: boolean
        required: false
        default: false

# Federated credentials, not a stored client secret: id-token lets both terraform and azd
# exchange a GitHub OIDC token for an Azure one, so there is no long-lived credential in this
# repository to leak or rotate.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7

      # Fail fast and name every missing value. The "Assert every service starts in Development"
      # guard in dotnet.yml silently consumed two secrets that were never created and only failed
      # months later, on the first PR that ran it — a preflight is cheap insurance against repeating
      # that with a half-provisioned Azure environment.
      - name: Preflight — required configuration is present
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          TF_VAR_agenda_buddy_connection_string: ${{ secrets.ATLAS_AGENDA_BUDDY_CONNECTION_STRING }}
          TF_VAR_identity_db_connection_string: ${{ secrets.ATLAS_IDENTITY_DB_CONNECTION_STRING }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_jwt_public_key: ${{ secrets.JWT_PUBLIC_KEY }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_LOCATION \
                      TF_STATE_RESOURCE_GROUP TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER; do
            [ -n "${!name:-}" ] || missing="$missing $name (repository or environment variable)"
          done
          for name in TF_VAR_agenda_buddy_connection_string TF_VAR_identity_db_connection_string \
                      TF_VAR_jwt_public_key TF_VAR_jwt_private_key; do
            [ -n "${!name:-}" ] || missing="$missing $name (environment secret)"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required configuration:$missing — see docs/deployment.md"
            exit 1
          fi
          echo "All required configuration present."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      # This environment's own deploy identity (client_id/tenant_id/subscription_id) is what
      # authenticates this very step via OIDC — for a brand-new environment that identity does
      # not exist yet, which is why creating one is a one-time human-run `terraform apply` (see
      # docs/deployment.md) rather than something this workflow can do for itself. Every run
      # after that first one is unattended.
      - name: Terraform init
        working-directory: infra/terraform/environment
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=agenda-buddy-${{ inputs.environment }}.tfstate"

      - name: Terraform apply
        working-directory: infra/terraform/environment
        env:
          TF_VAR_environment_name: ${{ inputs.environment }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_agenda_buddy_connection_string: ${{ secrets.ATLAS_AGENDA_BUDDY_CONNECTION_STRING }}
          TF_VAR_identity_db_connection_string: ${{ secrets.ATLAS_IDENTITY_DB_CONNECTION_STRING }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_jwt_public_key: ${{ secrets.JWT_PUBLIC_KEY }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
        run: terraform apply -input=false -auto-approve

      # Feeds azd exactly what it would otherwise have asked a human for interactively:
      # AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID for federated login, plus the connection
      # strings and JWT keys the AppHost's cloud shape (AppHostWiring.cs) declares as parameters
      # — read from this environment's own Key Vault rather than a hand-maintained secret blob.
      - name: Read Terraform outputs
        id: tf
        working-directory: infra/terraform/environment
        run: |
          {
            echo "client_id=$(terraform output -raw client_id)"
            echo "resource_group_name=$(terraform output -raw resource_group_name)"
            echo "key_vault_name=$(terraform output -raw key_vault_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Must precede any azd invocation: azd is not present on the runner image, so calling
      # `azd auth login` before this step fails with command not found.
      - name: Install azd
        uses: Azure/setup-azd@v2

      # Two separate credential stores, both needed. `azd auth login` authenticates azd only; the
      # Key Vault step below shells out to the az CLI, which reads none of azd's state and would
      # fail unauthenticated without this.
      - name: az login (federated, this environment's own identity)
        uses: azure/login@v2
        with:
          client-id: ${{ steps.tf.outputs.client_id }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: azd login (federated, this environment's own identity)
        run: |
          azd auth login \
            --client-id "${{ steps.tf.outputs.client_id }}" \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}" \
            --federated-credential-provider github

      - name: Configure azd environment from Key Vault
        env:
          KEY_VAULT_NAME: ${{ steps.tf.outputs.key_vault_name }}
        run: |
          set -eu
          azd env new "${{ inputs.environment }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --no-prompt || azd env select "${{ inputs.environment }}"

          # Names on the left are what the AppHost's resource graph declares
          # (AppHostWiring.cs: agenda-buddy / IdentityDb connection strings, jwt-public-key /
          # jwt-private-key parameters) — azd derives the exact environment-variable names it
          # prompts for from that graph; capture them once from a `azd provision` dry run if this
          # list ever needs updating.
          declare -A secret_names=(
            [agenda-buddy-connection]=CONNECTIONSTRING_AGENDA_BUDDY
            [identity-db-connection]=CONNECTIONSTRING_IDENTITYDB
            [resend-api-key]=RESEND_API_KEY
            [jwt-public-key]=JWT_PUBLIC_KEY
            [jwt-private-key]=JWT_PRIVATE_KEY
          )
          # resend-api-key is absent when the environment has no mail provider (see
          # infra/terraform/environment/main.tf). An absent secret is skipped rather than fatal; the
          # service then logs a startup warning naming the key.
          optional=" resend-api-key "
          for secret in "${!secret_names[@]}"; do
            if ! value=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$secret" \
                           --query value -o tsv 2>/dev/null); then
              case "$optional" in
                *" $secret "*)
                  echo "::warning::$secret is not set in $KEY_VAULT_NAME — continuing without it."
                  continue
                  ;;
                *)
                  echo "::error::$secret is missing from $KEY_VAULT_NAME."
                  exit 1
                  ;;
              esac
            fi
            azd env set "${secret_names[$secret]}" "$value"
          done

      - name: azd provision
        if: ${{ inputs.provision }}
        run: azd provision --no-prompt

      - name: azd deploy
        run: azd deploy --no-prompt

      - name: Smoke test — the gateway reports healthy
        if: success()
        run: |
          # Only the gateway has external ingress (AppHostWiring.cs — the 7 domain services
          # are deliberately internal-only in the Cloud shape), so it is the only endpoint this
          # runner can reach at all; a service being unreachable from here is expected, not a
          # failure.
          azd show --output json | tee "$RUNNER_TEMP/azd-show.json"
          python3 - "$RUNNER_TEMP/azd-show.json" <<'PY'
          import json, sys, urllib.request

          with open(sys.argv[1]) as f:
              data = json.load(f)

          endpoint = (data.get("services", {}).get("gateway", {}).get("endpoint") or "").rstrip("/")
          if not endpoint:
              print("::error::azd show reported no endpoint for the gateway service.")
              sys.exit(1)

          for probe in ("/health", "/alive"):
              url = f"{endpoint}{probe}"
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      if response.status != 200:
                          print(f"::error::{url} -> HTTP {response.status}")
                          sys.exit(1)
              except Exception as exc:
                  print(f"::error::{url} -> {exc}")
                  sys.exit(1)

          print(f"Gateway healthy: {endpoint}/health and /alive both returned 200.")
          PY
