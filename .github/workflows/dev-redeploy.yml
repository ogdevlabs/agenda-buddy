name: Dev environment — redeploy (stop, deploy, restore)

# The whole "bring a deployed environment up to a commit" sequence, in one place, reachable two ways:
#
#   * workflow_call — .NET CI calls this on a merge to main that touched a deployable path. The gating
#     (is CI green, is auto-deploy enabled, did anything deployable change) lives THERE, because that is
#     where the pipeline context is.
#   * workflow_dispatch — a human running it on demand. No gate: dispatching it IS the decision.
#
# One implementation either way, so the pipeline and the button cannot drift into doing different things.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# WHY THREE STAGES AND NOT TWO
#
# `dev-env-stop` sets minReplicas=0 through `az containerapp update`. `azd deploy` then creates a new
# revision per app carrying the new image, but it does NOT reset the scale rule — only `azd provision`
# re-applies the template's replica settings, and provision defaults to false here because application
# code changing is not a reason to re-apply infrastructure.
#
# ⚠️ `azd deploy` ALSO does not re-apply parameters or secrets. Terraform writes them to Key Vault on
# every run and the deploy job marshals them into azd parameters on every run, but only `azd provision`
# pushes them onto the container apps. So a secret corrected at the source stays corrected nowhere until
# a provision run — which is why `provision` is a dispatch input rather than a constant.
#
# So a bare stop→deploy leaves the new code at minReplicas=0: not truly down, because ACA cold-starts it
# on an inbound request, but not started either, and `dev-env-schedule` would not correct it until the
# next weekday 09:00. The restore stage returns the environment to the state the schedule would have
# chosen — started inside the window, deliberately left stopped outside it, because starting it out of
# hours would defeat the cost control that schedule exists for.
#
# WHY STOP FIRST AT ALL. Not technically required: the apps are in Single revision mode, so a deploy
# replaces the running revision regardless. It buys one real thing — no window in which an old and a new
# revision are both live against the one shared Atlas database.

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to redeploy"
        required: false
        default: dev
        type: string
      # Defaults false, so the pipeline caller that omits it keeps getting an application-only deploy.
      provision:
        description: "Also run azd provision (re-applies infrastructure AND parameters/secrets)"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to redeploy"
        required: false
        default: dev
        type: string
      # ⚠️ Exposed because some fixes are only reachable through provision, and a hardcoded false meant the
      # operator had to edit this file to get one. A changed secret or parameter is the case that matters:
      # `azd deploy` pushes images and nothing else, so a parameter corrected in Key Vault does NOT reach the
      # container apps until provision re-applies it. That is how a push credential stayed broken in dev while
      # every deploy reported success.
      #
      # Prefer this over dispatching deploy.yml directly for anything on the dev environment: deploy.yml alone
      # skips the stop and restore stages, and `azd deploy` does not reset the scale rule dev-env-stop changed
      # — see this file's header.
      provision:
        description: "Also run azd provision — needed when a secret or parameter changed, not just code"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

# ⚠️ A DIFFERENT group from deploy.yml's, and it has to be.
#
# This originally used deploy.yml's own `deploy-<env>` group, reasoning that a dispatch, a pipeline run and
# a manual deploy should all serialise together. That deadlocked: this workflow acquires the group and then
# calls deploy.yml, which requests THE SAME group — which can never be released, because releasing it is
# what this workflow is waiting on the child to allow. GitHub resolves the impossible pending job by
# failing it, with no log and no check run, so run 358 showed every visible job green and the run red.
# (`dev-env-power.yml`, the other nested call, declares no concurrency at all — which is exactly why the
# `stop` stage succeeded while `deploy` never started. That contrast is what identified it.)
#
# Distinct groups still give the guarantee that was wanted: two redeploys serialise here, and the inner
# deploy serialises against any directly dispatched deploy.yml on `deploy-<env>`. Nothing overlaps, and
# nothing waits on itself.
#
# Never cancel-in-progress: a half-applied Terraform/azd run is worse than a queued one.
concurrency:
  group: redeploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Whether the schedule would have this environment running at this moment. Runs alongside the stop so
  # it costs no wall-clock, and is read by `restore` at the end.
  #
  # Mexico City is UTC-6 ALL YEAR — Mexico abolished DST in 2022 — which is why one fixed offset is
  # correct in January and July alike. Same window and same reasoning as dev-env-schedule.yml; if Mexico
  # ever reinstates DST, that file and this job both need revisiting.
  window:
    runs-on: ubuntu-24.04
    outputs:
      start_after: ${{ steps.window.outputs.start_after }}
    steps:
      - name: Would the schedule have this running right now?
        id: window
        run: |
          set -euo pipefail
          now_utc_h=$(date -u +%-H)
          dow=$(date -u +%u)          # 1..7, Monday..Sunday, in UTC
          local_h=$(( (now_utc_h - 6 + 24) % 24 ))

          # A UTC hour before 06:00 is the previous LOCAL day, which can move a Monday back to Sunday.
          local_dow=$dow
          if [ "$now_utc_h" -lt 6 ]; then local_dow=$(( (dow + 5) % 7 + 1 )); fi

          if [ "$local_dow" -le 5 ] && [ "$local_h" -ge 9 ] && [ "$local_h" -lt 17 ]; then
            echo "start_after=true" >> "$GITHUB_OUTPUT"
            echo "Mexico City ${local_h}:xx, day ${local_dow} — inside the window, will start after deploying."
          else
            echo "start_after=false" >> "$GITHUB_OUTPUT"
            echo "Mexico City ${local_h}:xx, day ${local_dow} — outside the window, leaving stopped."
          fi

  stop:
    uses: ./.github/workflows/dev-env-power.yml
    with:
      action: stop
      environment: ${{ inputs.environment }}
    secrets: inherit

  deploy:
    needs: stop
    # Defaults to false, so a merge to main still gets an application-only deploy — re-applying
    # infrastructure on every merge would be pointless churn. Passing it through rather than hardcoding it
    # is what makes "the environment needs provision" an operator decision at dispatch time instead of a
    # commit to this file.
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      provision: ${{ inputs.provision || false }}
    secrets: inherit

  restore:
    needs: [window, deploy]
    if: ${{ needs.window.outputs.start_after == 'true' }}
    uses: ./.github/workflows/dev-env-power.yml
    with:
      action: start
      environment: ${{ inputs.environment }}
    secrets: inherit

  # Reports the end state explicitly, including the one that surprises people: a successful deploy that
  # deliberately left the environment stopped because it ran outside working hours.
  report:
    needs: [window, deploy, restore]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          {
            echo "### ${{ inputs.environment }} after this redeploy"
            echo
            echo "- deploy: ${{ needs.deploy.result }}"
            if [ "${{ inputs.provision }}" = "true" ]; then
              echo "- provision: **ran** — infrastructure, parameters and secrets re-applied."
            else
              echo "- provision: skipped (application code only). A changed secret or parameter does NOT"
              echo "  reach the container apps on this path — re-run with provision: true for that."
            fi
            if [ "${{ needs.window.outputs.start_after }}" = "true" ]; then
              echo "- restarted: ${{ needs.restore.result }} (inside 09:00–17:00 Mexico City, weekday)"
            else
              echo "- **left stopped on purpose** — outside 09:00–17:00 Mexico City on a weekday."
              echo "  The new code IS deployed. Run \"Dev environment — start\" to bring it up now, or"
              echo "  the schedule will at the next weekday 09:00."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
