name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect which areas of the codebase changed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile-tests: ${{ steps.filter.outputs.mobile-tests }}
      library: ${{ steps.filter.outputs.library }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            library:
              - 'Library/**'
              - 'EventAndCommands/**'
              - 'Directory.Build.props'
            api:
              - 'Library/**'
              - 'EventAndCommands/**'
              - 'Booking/**'
              - 'Calendar/**'
              - 'Customer/**'
              - 'Provider/**'
              - 'Services/**'
              - 'Profession/**'
              - 'Identity/**'
              - 'Kafka/**'
              - 'AgendaBuddy.AppHost/**'
              - 'AgendaBuddy.ServiceDefaults/**'
              - '*.Tests/**'
              - '!MobileApp.Tests/**'
              - 'Directory.Build.props'
              - '*.sln'
              # Without these a change to only infrastructure ran zero jobs (R-8) — the same
              # silent-merge gap that let the AppHost land untested.
              - '*.slnf'
              - 'global.json'
              - 'Dockerfile*'
              - '*/Dockerfile'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            mobile:
              - 'MobileApp/**'
              - 'Library/**'
              - 'Directory.Build.props'
            mobile-tests:
              - 'MobileApp/**'
              - 'MobileApp.Tests/**'
              - 'Library/**'
              - 'Directory.Build.props'

  # ---------------------------------------------------------------------------
  # API services — build + test (runs when backend or shared library changes)
  # ---------------------------------------------------------------------------
  build-and-test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # agenda-buddy-backend.slnf is the solution minus MobileApp and MobileApp.Tests. Those are
      # covered by the three mobile jobs below, and MobileApp currently does not compile under
      # /p:MobileWorkloads=false (agenda-buddy-prr) — a pre-existing defect that would otherwise
      # fail this job for a reason unrelated to the backend.
      - name: Restore dependencies
        run: dotnet restore agenda-buddy-backend.slnf /p:MobileWorkloads=false

      - name: Build
        run: dotnet build agenda-buddy-backend.slnf --no-restore --configuration Release /p:MobileWorkloads=false

      - name: Test
        run: >
          dotnet test agenda-buddy-backend.slnf
          --no-build
          --configuration Release
          --filter "Category!=Acceptance"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      # ---- F-013 guards -----------------------------------------------------
      # No `dotnet workload install aspire` step: no such workload exists. Aspire has been
      # NuGet-only since 9.0, so restore is the only prerequisite (verified in F-013-T01).
      - name: Build AppHost
        run: dotnet build AgendaBuddy.AppHost/AgendaBuddy.AppHost.csproj --configuration Release /p:MobileWorkloads=false

      - name: Assert AppHost does not reference MobileApp        # AC-1.5
        run: |
          if dotnet list AgendaBuddy.AppHost/AgendaBuddy.AppHost.csproj reference | grep -q MobileApp; then
            echo "::error::AppHost must not reference MobileApp"; exit 1
          fi

      # AC-2.1 / AC-2.2. Narrow by design: this is one pattern, not a secret scanner. The
      # CONSTITUTION section 7 dependency-audit and secret-scan gate remains open, deferred to
      # F-017 — do not read this step as closing it.
      # Scans docs/pdlc too — two of the seventeen leaked copies lived in docs/pdlc/context,
      # so excluding that tree would exempt the one directory with a proven record of ingesting
      # secrets. Known redaction placeholders are filtered out instead.
      - name: Assert no committed database credential
        run: |
          if git grep -nE 'mongodb(\+srv)?://[^ "/]+:[^@"]+@' -- . \
              | grep -vE '<REDACTED-ROTATE-THIS>|<the-leaked-password>|<user>:<' ; then
            echo "::error::Credential found in tracked files"; exit 1
          fi

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Mobile — Android build (runs when MobileApp or shared library changes)
  # ---------------------------------------------------------------------------
  build-android:
    name: "Mobile — Android Build"
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android (Release)
        run: dotnet build MobileApp/MobileApp.csproj /p:MobilePlatform=android -c Release

  # ---------------------------------------------------------------------------
  # Mobile — iOS build (runs when MobileApp or shared library changes)
  # ---------------------------------------------------------------------------
  build-ios:
    name: "Mobile — iOS Build"
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS (Release)
        run: dotnet build MobileApp/MobileApp.csproj /p:MobilePlatform=ios -c Release

  # ---------------------------------------------------------------------------
  # Mobile — ViewModel / Service unit tests
  # ---------------------------------------------------------------------------
  build-mobile-tests:
    name: "Mobile — Unit Tests"
    needs: changes
    if: needs.changes.outputs.mobile-tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test MobileApp (no mobile workloads)
        run: >
          dotnet test MobileApp.Tests/MobileApp.Tests.csproj
          /p:MobileWorkloads=false
          --filter "Category!=Acceptance"
          --collect:"XPlat Code Coverage"
