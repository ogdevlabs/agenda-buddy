name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

# Cancel a superseded run for the same branch/PR when a new commit is pushed — this pipeline had no
# concurrency group at all (documented gap, docs/pdlc/context/08-cicd-deploy.md), so pushing twice in
# quick succession ran two full overlapping builds. `github.head_ref` is set on pull_request events
# (the PR's own branch) and empty on push events, so `|| github.ref` falls back to the branch ref for
# a direct push to main — each branch/PR gets its own group, main pushes never cancel each other's
# already-completed-by-the-time-the-next-lands runs in practice, but the fallback keeps the group key
# valid either way.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detect which areas of the codebase changed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile-tests: ${{ steps.filter.outputs.mobile-tests }}
      library: ${{ steps.filter.outputs.library }}
      # F-017-T06: narrower than `api` on purpose — the image-build matrix is expensive (7 parallel
      # publishes), so it triggers only on the 7 service directories and docker-compose*.yml, not on
      # every backend-adjacent change `api` also covers (AgendaBuddy.Library, AgendaBuddy.EventAndCommands, test projects).
      docker: ${{ steps.filter.outputs.docker }}
      # AND-ed into every build job so a markdown-only change never builds. See the long note on
      # the filters below for why this is a separate filter rather than a `!**/*.md` negation.
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On a pull_request these are evaluated against the whole base...HEAD diff, not the last
          # commit — so one file in AgendaBuddy.Library/** fires every filter that mentions it for the life of
          # the branch. That is why the lists below are deliberate about which jobs a shared change
          # is worth paying for.
          #
          # Docs-only changes run no build jobs. The `summary` job still reports, so a docs PR gets
          # a green check rather than an empty one.
          #
          # ── Why there are no `!` negations below ──────────────────────────────────────────────
          # dorny/paths-filter@v4 supports only predicate-quantifier 'some' (the default) and
          # 'every'. Under 'some' every pattern is OR-ed, so a leading-`!` pattern does NOT exclude
          # anything — it is silently a no-op. ('some-with-excludes', which would work, exists only
          # on master; it is not in the v3 tag.) 'every' is unusable here because no single file can
          # match all of `AgendaBuddy.Library/**`, `AgendaBuddy.Booking.Api/**`, … at once.
          #
          # Two real bugs came from that misunderstanding, both fixed below:
          #   1. Markdown inside a code directory built the whole backend. `AgendaBuddy.Kafka/readme.md`
          #      matches `AgendaBuddy.Kafka/**`, so editing it ran the full build + test. `docs/**` and root-level `*.md`
          #      were always fine; markdown nested under a service was not.
          #   2. `- '!AgendaBuddy.MobileApp.Tests/**'` never excluded anything. `*.Tests/**` matches
          #      `AgendaBuddy.MobileApp.Tests/**`, so a mobile-test-only change ran the backend job.
          #
          # Fixes, both of which work under OR semantics:
          #   • A separate `code` filter lists code-ish file types positively. Build jobs require
          #     BOTH their area filter AND `code`, so a markdown-only change can never build.
          #   • `*.Tests/**` is replaced with the 12 backend test projects named explicitly, so
          #     AgendaBuddy.MobileApp.Tests is excluded by not being listed rather than by a no-op negation.
          filters: |
            # True when at least one genuinely code-relevant file changed. AND-ed into every build
            # job's condition. Excludes markdown by simply not listing it.
            #
            # ⚠ This list must stay EXHAUSTIVE. Because the build jobs now require `code == true`,
            # an unlisted-but-code-relevant extension makes the build SILENTLY SKIP rather than
            # run — the failure mode is fail-closed, the opposite of the old behaviour. The
            # `summary` job prints a loud warning whenever an area filter fired while `code` did
            # not, so this can never skip a build unnoticed. Verified against every extension
            # actually tracked in the repo on 2026-08-18.
            code:
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.props'
              - '**/*.targets'
              - '**/*.json'
              - '**/*.sln'
              - '**/*.slnf'
              - '**/*.xaml'
              - '**/*.yml'
              - '**/*.yaml'
              - '**/Dockerfile*'
              - '**/.dockerignore'
              - '**/*.sh'
              - '**/*.editorconfig'
              # AgendaBuddy.MobileApp platform + resource files: these are compiled into the Android/iOS heads,
              # so a change to a manifest, Info.plist, privacy manifest or app icon is a real build
              # input, not documentation.
              - '**/*.xml'
              - '**/*.plist'
              - '**/*.xcprivacy'
              - '**/*.svg'
            library:
              - 'AgendaBuddy.Library/**'
              - 'AgendaBuddy.Library.ServerAuth/**'
              - 'AgendaBuddy.EventAndCommands/**'
              - 'Directory.Build.props'
            api:
              - 'AgendaBuddy.Library/**'
              # AgendaBuddy.Library.ServerAuth was absent from every filter, so a change to JWT validation —
              # the code that decides whether a request is authenticated — ran zero jobs.
              - 'AgendaBuddy.Library.ServerAuth/**'
              - 'AgendaBuddy.EventAndCommands/**'
              - 'AgendaBuddy.Booking.Api/**'
              - 'Calendar/**'
              - 'Customer/**'
              - 'Provider/**'
              - 'Services/**'
              - 'Profession/**'
              - 'AgendaBuddy.Identity/**'
              - 'AgendaBuddy.Kafka/**'
              - 'AgendaBuddy.AppHost/**'
              - 'AgendaBuddy.ServiceDefaults/**'
              # The 12 backend test projects, named explicitly. AgendaBuddy.MobileApp.Tests is absent on
              # purpose — it is covered by the mobile-tests job and must not gate the backend.
              - 'AgendaBuddy.Booking.Tests/**'
              - 'Calendar.Tests/**'
              - 'Customer.Tests/**'
              - 'Provider.Tests/**'
              - 'Services.Tests/**'
              - 'Profession.Tests/**'
              - 'AgendaBuddy.Identity.Tests/**'
              - 'AgendaBuddy.Library.Tests/**'
              - 'AgendaBuddy.Kafka.Tests/**'
              - 'AgendaBuddy.EventsAndCommands.Tests/**'
              - 'AgendaBuddy.AppHost.Tests/**'
              - 'AgendaBuddy.ServiceDefaults.Tests/**'
              # AgendaBuddy.IntegrationTests is the 13th test project and is deliberately OUTSIDE
              # agenda-buddy-backend.slnf (ADR-031), so build-and-test never touches it — the
              # `integration` job below does. Listed here because without it a change to the harness
              # alone matched no filter and ran ZERO jobs: the same silent-skip that let F-013's
              # "assert every service starts" guard sit unexecuted until it first ran, and first
              # failed, on PR #35.
              - 'AgendaBuddy.IntegrationTests/**'
              - 'Directory.Build.props'
              - '*.sln'
              # Without these a change to only infrastructure ran zero jobs (R-8) — the same
              # silent-merge gap that let the AppHost land untested.
              - '*.slnf'
              - 'global.json'
              - 'Dockerfile*'
              - '*/Dockerfile'
              - 'docker-compose*.yml'
              # This workflow only, not '.github/workflows/**': deploy.yml cannot be validated by
              # these jobs, so a deployment-pipeline edit no longer rebuilds the entire backend.
              - '.github/workflows/dotnet.yml'
            # F-017-T06: the docker-build-and-scan matrix's own trigger — deliberately NARROWER than
            # `api` above. `api` also fires on AgendaBuddy.Library/AgendaBuddy.EventAndCommands/AgendaBuddy.Kafka/test-project changes,
            # which would run 7 parallel container publishes for a change that touches no service's
            # own container output. Scoped to exactly PRD Requirement 9's list: the 7 service dirs
            # (their .csproj files are inside these globs already), and docker-compose*.yml.
            docker:
              - 'AgendaBuddy.Booking.Api/**'
              - 'Calendar/**'
              - 'Customer/**'
              - 'Provider/**'
              - 'Services/**'
              - 'Profession/**'
              - 'AgendaBuddy.Identity/**'
              - 'docker-compose*.yml'
            # Android and iOS each install a MAUI workload and take minutes (iOS runs on a macOS
            # runner, billed at 10x Linux). Reserved for changes to the app itself — a shared AgendaBuddy.Library
            # change is covered by mobile-tests below, which compiles AgendaBuddy.MobileApp against it under the
            # fallback TFM and would catch a break (that is exactly how agenda-buddy-prr's CS0103
            # surfaced). If an AgendaBuddy.Library change ever breaks only the platform heads, add 'AgendaBuddy.Library/**'
            # back here and accept the minutes.
            mobile:
              - 'AgendaBuddy.MobileApp/**'
              - 'Directory.Build.props'
              - '.github/workflows/dotnet.yml'
            mobile-tests:
              - 'AgendaBuddy.MobileApp/**'
              - 'AgendaBuddy.MobileApp.Tests/**'
              - 'AgendaBuddy.Library/**'
              - 'Directory.Build.props'
              - '.github/workflows/dotnet.yml'

  # ---------------------------------------------------------------------------
  # API services — build + test (runs when backend or shared library changes)
  # ---------------------------------------------------------------------------
  build-and-test:
    needs: changes
    if: needs.changes.outputs.api == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # agenda-buddy-backend.slnf is the solution minus AgendaBuddy.MobileApp and AgendaBuddy.MobileApp.Tests. Those are
      # covered by the three dedicated mobile jobs below (build-android, build-ios, build-mobile-tests),
      # which install the MAUI workloads this job does not need. Keeping mobile out of the backend job
      # means a mobile-only break cannot fail the backend build for an unrelated reason.
      #
      # Updated 2026-08-18: this comment previously said AgendaBuddy.MobileApp "does not compile under
      # /p:MobileWorkloads=false (agenda-buddy-prr)". That defect is fixed and the bead is closed —
      # AgendaBuddy.MobileApp.Tests passes 67 (7 skipped). The exclusion is by design, not a workaround.
      - name: Restore dependencies
        run: dotnet restore agenda-buddy-backend.slnf /p:MobileWorkloads=false

      - name: Build
        run: dotnet build agenda-buddy-backend.slnf --no-restore --configuration Release /p:MobileWorkloads=false

      # F-018-T03: the root .editorconfig (added this task) is the only thing stopping whitespace
      # drift from recurring — v0.1.0 fixed 69 such findings with nothing to keep them fixed, and
      # F-019/F-020 rewrite every endpoint file next, where drift would hide real changes in review.
      # `--no-restore` reuses the Restore step above; this only reports, it never rewrites files.
      - name: Format check (dotnet format --verify-no-changes)
        run: dotnet format agenda-buddy-backend.slnf --verify-no-changes --no-restore

      - name: Test
        run: >
          dotnet test agenda-buddy-backend.slnf
          --no-build
          --configuration Release
          --filter "Category!=Acceptance"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      # ---- F-013 guards -----------------------------------------------------
      # No `dotnet workload install aspire` step: no such workload exists. Aspire has been
      # NuGet-only since 9.0, so restore is the only prerequisite (verified in F-013-T01).
      - name: Build AppHost
        run: dotnet build AgendaBuddy.AppHost/AgendaBuddy.AppHost.csproj --configuration Release /p:MobileWorkloads=false

      - name: Assert AppHost does not reference AgendaBuddy.MobileApp        # AC-1.5
        run: |
          if dotnet list AgendaBuddy.AppHost/AgendaBuddy.AppHost.csproj reference | grep -q AgendaBuddy.MobileApp; then
            echo "::error::AppHost must not reference AgendaBuddy.MobileApp"; exit 1
          fi

      # Guards the captive-dependency class of bug (F-013-T13). DI validation runs only in
      # Development, which is the environment the AppHost uses, so a singleton capturing a scoped
      # service builds fine and fails at runtime. Six of seven services were broken this way and
      # no unit test could see it — only starting the process could. Cheap: a few seconds each.
      - name: Assert every service starts in Development
        run: |
          set -u
          # Throwaway keypair generated per run, deliberately not repo secrets. This check only
          # proves the DI graph builds and the process binds a port, so the keys need to be
          # syntactically valid PEM, nothing more. Depending on secrets.CI_JWT_* meant the step
          # failed with "Required environment variable 'JWT_PUBLIC_KEY' is not set" the first time
          # it ever ran, because those secrets were never created — a hermetic step cannot rot
          # that way, and there is no signing key here worth protecting.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          JWT_PRIVATE_KEY=$(cat "$RUNNER_TEMP/jwt.key")
          JWT_PUBLIC_KEY=$(cat "$RUNNER_TEMP/jwt.pub")
          export JWT_PRIVATE_KEY JWT_PUBLIC_KEY

          for svc in AgendaBuddy.Booking.Api Calendar Customer Provider Services Profession AgendaBuddy.Identity; do
            log=$(mktemp)
            ASPNETCORE_ENVIRONMENT=Development \
            ConnectionStrings__mongodb='mongodb://localhost:27017' \
              dotnet run --project "$svc" --no-build -c Release --no-launch-profile > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 40); do
              sleep 1
              grep -q "Now listening on" "$log" && break
              kill -0 $pid 2>/dev/null || break
            done
            if grep -q "Now listening on" "$log"; then
              echo "$svc: started"
            else
              echo "::error::$svc failed to start in Development"; tail -30 "$log"; exit 1
            fi
            kill $pid 2>/dev/null || true
          done

      # AC-2.1 / AC-2.2. Narrow by design: this is one pattern, not a secret scanner. The
      # CONSTITUTION section 7 dependency-audit and secret-scan gate remains open, deferred to
      # F-017 — do not read this step as closing it.
      # Scans docs/pdlc too — two of the seventeen leaked copies lived in docs/pdlc/context,
      # so excluding that tree would exempt the one directory with a proven record of ingesting
      # secrets. Known redaction placeholders are filtered out instead.
      - name: Assert no committed database credential
        run: |
          # F-017: scripts/verify-gitleaks-canary.sh's fixture-generating line matches this shape
          # textually (mongodb+srv://user:${FAKE_PASSWORD}@host) even though ${FAKE_PASSWORD} is an
          # unresolved shell variable reference in the source, never a real secret. Found live on
          # PR #48 — this grep only sees text shape, not that it's a variable. Excluded alongside
          # the other known-safe placeholders below, same reasoning as each of them.
          if git grep -nE 'mongodb(\+srv)?://[^ "/]+:[^@"]+@' -- . \
              | grep -vE '<REDACTED-ROTATE-THIS>|<the-leaked-password>|<user>:<|\$\{FAKE_PASSWORD\}' ; then
            echo "::error::Credential found in tracked files"; exit 1
          fi

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: .NET Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Security — dependency-vulnerability audit (CONSTITUTION §7, F-017-T03)
  #
  # Runs independently of, and in parallel with, build-and-test — no shared steps, no added
  # latency to that job.
  #
  # ⚠️ Scans agenda-buddy.sln (the FULL solution), not agenda-buddy-backend.slnf. The slnf
  # excludes AgendaBuddy.IntegrationTests (ADR-031), which is the only project referencing the
  # one currently-accepted vulnerable package (SSH.NET, via Testcontainers) — scanning the slnf
  # would report zero findings and give this gate nothing to actually catch. Verified live during
  # Construction: `dotnet list agenda-buddy-backend.slnf package --vulnerable` reports 0 vulnerable
  # packages solution-wide, while `dotnet list agenda-buddy.sln package --vulnerable` reports the
  # one accepted SSH.NET HIGH.
  #
  # ⚠️ `dotnet list package --vulnerable` does NOT respect a project's `<NoWarn>NU1903</NoWarn>`.
  # ARCHITECTURE.md's F-017 design assumed the ADR-030 suppression would filter this command's
  # report automatically because it is "an MSBuild-level suppression, not a CI-script filter" —
  # verified WRONG live during Construction: the finding still appears in the report with the
  # NoWarn in place (NoWarn only suppresses the *build-time warning*, not this reporting command).
  # So the accepted finding is filtered explicitly below, by its exact advisory ID — not by package
  # name, so a *different*, future SSH.NET vulnerability still fails the gate.
  security-scan:
    name: "Security — dependency audit"
    needs: changes
    # Review I1 (Party Review, 2026-08-26): deliberately UNCONDITIONAL, not gated on any path
    # filter. The original api+code gate silently skipped this job on a docs/scripts/AgendaBuddy.Gateway/
    # AgendaBuddy.MobileApp-only PR — and the credential this feature exists to stop recurring (ISSUE-002)
    # leaked partly into files under docs/pdlc/context/, exactly the path class that gate excluded.
    # A secret scanner and a dependency audit are cheap enough to run on every PR unconditionally;
    # "docs-only changes run no build jobs" (the changes job's own stated design goal) is the right
    # policy for build-and-test, not for a security gate.
    if: always()
    runs-on: ubuntu-24.04

    steps:
      # fetch-depth: 0 (full history) so gitleaks' PR-diff scan below can actually diff against
      # the PR's base — a shallow checkout has no base commit to diff from, and a secret
      # introduced then removed within the same PR must still be caught.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies (full solution)
        run: dotnet restore agenda-buddy.sln /p:MobileWorkloads=false

      - name: Dependency vulnerability audit
        run: |
          set -uo pipefail
          # GitHub Actions invokes `run:` steps as `bash -e {0}` — found live on PR #48: this job
          # failed with zero output at all, meaning `dotnet list` itself returned nonzero in CI
          # (reproducible cause not identified; ran clean locally every time). Under -e, a failing
          # command inside `$(...)` aborts the script immediately, before `echo "$output"` even
          # runs — so a transient/environment-specific nonzero exit from the tool silently skipped
          # this step's real job (the new-findings filter below) instead of running it. `|| true`
          # neutralizes that, matching the same protection `new_findings=(... || true)` already has
          # a few lines down — the actual pass/fail decision is our own grep-based filter, not
          # whatever exit code `dotnet list` happens to return.
          output=$(dotnet list agenda-buddy.sln package --vulnerable --include-transitive --no-restore 2>&1) || true
          echo "$output"

          # ADR-030: SSH.NET GHSA-q939-rpr3-3284 (HIGH), pulled in by Testcontainers in
          # AgendaBuddy.IntegrationTests, is an accepted risk — unreachable because this project
          # never uses Docker-over-SSH, proven by ContainerRuntimeGuardTest. Filtered by exact
          # advisory ID, not by package name, so a future SSH.NET finding still fails this gate.
          new_findings=$(echo "$output" | grep -E '^\s*>' | grep -E '\s(High|Critical)\s' | grep -v 'GHSA-q939-rpr3-3284' || true)

          if [ -n "$new_findings" ]; then
            echo "::error::New HIGH/CRITICAL vulnerable package finding(s), not covered by an accepted-risk ADR:"
            echo "$new_findings"
            exit 1
          fi

          if echo "$output" | grep -q 'GHSA-q939-rpr3-3284'; then
            echo "Known accepted finding present (ADR-030, SSH.NET GHSA-q939-rpr3-3284) — not failing."
          fi

      # F-017-T04. gitleaks/gitleaks-action detects the pull_request event itself and, given full
      # history (fetch-depth: 0 above), scans the PR's base..head diff range rather than the whole
      # repo — so a secret introduced and then removed within the same PR is still caught. Pinned to
      # a commit SHA by F-017-T09, per the threat model's T-001 mitigation (PinnedThirdPartyActionsTest
      # asserts this for both this action and Trivy's, below).
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # F-017-T05. Regression guard for the rule above: proves the configured ruleset (.gitleaks.toml)
      # still detects an Atlas-credential-shaped secret (PRD AC 7), and that gitleaks-action's own
      # invocation (--redact -v --report-format=sarif, reproduced exactly here) never leaks the
      # fixture's literal value into console output or the SARIF report while still preserving
      # file:line ([security] AC 15, threat-model.md T-002). The fixture is generated into a temp
      # dir and never committed — a committed "leak" would fail the step above on every future PR.
      - name: Canary — gitleaks catches Atlas-credential shape and redacts it (F-017-T05)
        run: ./scripts/verify-gitleaks-canary.sh

      # F-018-T20 (Test layer 7b). gitleaks-action's own PR-diff mode always runs
      # `git log --no-merges --first-parent <base>^..<head>` — confirmed by reading its actual CI
      # log output on this feature's own PR (#69). `--first-parent` walks only the direct-commit
      # chain and NEVER diffs a merge commit's second parent — exactly where this project's own
      # worktree-agent convention (`git merge --no-ff`, used by F-015/F-017/F-018's parallel-task
      # builds) puts every line a sub-agent actually wrote. Verified live: the step above scanned 19
      # of this branch's 38 commits (52 KB); the full range is 38 commits (280 KB). A secret
      # introduced only via a worktree merge's second parent would pass the step above with
      # "no leaks found" and never be flagged — silently defeating CONSTITUTION §7's "always
      # required, cannot be unchecked" promise the moment this project's own build convention is
      # used. This step re-scans the full range with no --first-parent, using the same ruleset
      # (.gitleaks.toml, .gitleaksignore) so no existing accepted false positive needs a second
      # entry. No checksum pin on the binary (residual, accepted risk — same posture as any `curl`
      # step without one; revisit if this project starts checksum-pinning other tool downloads).
      - name: Secret scan (gitleaks, full range — no --first-parent)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.event.after }}"
          fi
          echo "Scanning full range (all parents): $range"
          /tmp/gitleaks detect --source . --log-opts="$range" --redact -v --exit-code=1

      # Review C1 (Party Review, 2026-08-26). Proves trivy-severity-gate.sh's project-vs-base-image
      # branching logic against synthetic fixtures — runs once here rather than per matrix entry in
      # docker-build-and-scan below, since it verifies the gate's generic logic, not any one
      # service's real scan.
      - name: Canary — trivy-severity-gate.sh distinguishes project findings from base-image findings
        run: ./scripts/verify-trivy-severity-gate.sh

  # ---------------------------------------------------------------------------
  # Docker image build — .NET SDK container support, 7-service matrix (F-017-T06)
  #
  # Targets this project's actual deployment path (AppHostWiring.cs's DeploymentTarget.Cloud, via
  # azd/aspire deploy), which builds images directly from each service's project file with .NET SDK
  # container support — it never reads the 7 hand-written Dockerfiles. No Dockerfile is referenced
  # anywhere in this job on purpose (see ARCHITECTURE.md "What exists today and why it's the wrong
  # artifact to secure"). Depends on F-017-T02 landing first — `dotnet publish -t:PublishContainer`
  # failed with NETSDK1152 for every service until that fix removed AgendaBuddy.EventAndCommands.csproj's
  # colliding appsettings.json copy. No registry push, no `docker run`, no health check — build and
  # scan (Trivy lands in F-017-T07) only.
  docker-build-and-scan:
    name: "Docker — ${{ matrix.service }}"
    needs: changes
    if: needs.changes.outputs.docker == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service: [AgendaBuddy.Booking.Api, Calendar, Customer, Provider, Services, Profession, AgendaBuddy.Identity]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish container image (.NET SDK container support, no Dockerfile)
        run: dotnet publish ${{ matrix.service }}/${{ matrix.service }}.csproj -t:PublishContainer

      # Found live on PR #48: .NET SDK container support lowercases the image name by default
      # (`ContainerRepository` defaults to the lowercased assembly name) — the built image is
      # `booking:latest`, not `Booking:latest`. GitHub Actions expressions have no built-in
      # toLower(), so compute it once here and reference the output below, rather than a
      # `Booking:latest`-shaped image-ref that isn't even valid OCI reference syntax (uppercase is
      # disallowed in image names) and fails Trivy with "could not parse reference".
      #
      # F-019-T04: verified live against a real `dotnet publish -t:PublishContainer` for
      # AgendaBuddy.Booking.Api — the SDK's default derivation replaces `.` with `-`, not just lowercasing, so
      # the built image is `booking-api:latest`, not `booking.api:latest`. The `tr` alone (dots
      # survive lowercasing unchanged) would have computed the wrong ref and failed Trivy the same
      # way the original uppercase bug did.
      - name: Lowercase the image name
        id: image
        run: echo "name=$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]' | tr '.' '-')" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        # v0.28.0 (the originally-pinned release) was found DEAD at Ship, not by inspection: its
        # action.yaml pins a nested dependency, `aquasecurity/setup-trivy`, by a mutable tag
        # (@v0.2.1) that upstream has since deleted — GitHub can no longer resolve it, so every job
        # using this exact SHA fails at "Set up job" before checkout even runs. Confirmed live on
        # PR #48. v0.32.0+ fixed this upstream (pins setup-trivy by hash, not tag) — upgraded to the
        # latest, v0.36.0, which does.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ steps.image.outputs.name }}:latest"
          format: json
          output: trivy-report.json
          exit-code: "0"

      # F-017-T07: Trivy's own report distinguishes findings by `.Results[].Target`. This
      # project's own published dependencies always land under `app/<Service>.deps.json` — a
      # target that only exists in the built image, never in the bare base image
      # (mcr.microsoft.com/dotnet/aspnet:10.0) it's built from. Every other target (the OS-package
      # layer, and the shared-framework deps.json files under usr/share/dotnet/) is inherited from
      # the base image and this project cannot fix a CVE in it directly — so it warns, not fails.
      # Verified live during Construction against both a synthetic fixture set and a real scan of
      # booking:latest (scripts/trivy-severity-gate.sh's own header has the full rationale).
      - name: Severity gate (fail on project-introduced, warn on base-image-inherited)
        run: ./scripts/trivy-severity-gate.sh trivy-report.json

  # ---------------------------------------------------------------------------
  # Integration — real services over HTTP against a MongoDB Testcontainer
  #
  # F-016-T20. SEPARATE from build-and-test on purpose, three reasons:
  #   1. AgendaBuddy.IntegrationTests is excluded from agenda-buddy-backend.slnf (ADR-031) so the
  #      unit gate stays Docker-free and fast. Running it here keeps that true.
  #   2. A container-runtime problem should read as "integration failed", not as "the backend build
  #      broke".
  #   3. It is the slowest gate, so it must be separately visible when it starts costing minutes.
  #
  # ⚠️ BLOCKING is a BRANCH-PROTECTION setting, not something this file can assert. Add
  #    "Integration — real services + MongoDB" to the required status checks for `main`, or this job
  #    can fail and a PR can still merge. Until that is done, the feature's central claim —
  #    authorization you can demonstrate — is enforced by nothing but habit.
  #
  # ⚠️ THIS JOB HAS NEVER RUN. The workflow triggers only on push to `main` or PR to `main`, so it
  #    cannot execute on an ordinary branch. Verifying it needs a real CI run on a short-lived
  #    throwaway branch pushed by the maintainer. That is F-016-T20's residual, recorded in the
  #    plan's known gaps and in verification.md — not an oversight.
  #
  # Needs no secrets: the harness generates its own RSA keypair per session in memory
  # (CryptoSessionFixture) and starts its own MongoDB container. Deliberate — F-013's CI guard
  # consumed secrets.CI_JWT_* that were never created, and failed the first time it ran.
  # ---------------------------------------------------------------------------
  integration:
    name: "Integration — real services + MongoDB"
    needs: changes
    if: needs.changes.outputs.api == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    # Hard ceiling. The suite measured 1 m 13 s locally with a warm image; a cold runner adds ~1 min
    # for the 1.13 GB mongo:7.0 pull. 20 minutes is generous on purpose — it exists to stop a hung
    # container burning a runner for six hours, not to police duration. That is the soft budget below.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Pulled explicitly, before the timed step, so the image download is not counted against the
      # suite's duration budget. Measured cold: ~60 s for 1.13 GB.
      - name: Pre-pull the MongoDB image
        run: docker pull mongo:7.0

      # /p:MobileWorkloads=false, same fix as the backend job: this project references AgendaBuddy.MobileApp.csproj
      # (F-015-T07, so MobileClientRouteResolutionTest can call AgendaBuddy.MobileApp.Routing.*RouteBuilder). Without
      # the flag, AgendaBuddy.MobileApp.csproj's default TargetFrameworks include net10.0-android/net10.0-ios, and
      # restore fails on this runner with NETSDK1147 (maui-android/maui-ios workloads not installed).
      - name: Restore dependencies
        run: dotnet restore AgendaBuddy.IntegrationTests/AgendaBuddy.IntegrationTests.csproj /p:MobileWorkloads=false

      - name: Build
        run: >
          dotnet build AgendaBuddy.IntegrationTests/AgendaBuddy.IntegrationTests.csproj
          --no-restore --configuration Release /p:MobileWorkloads=false

      # DURATION ENFORCEMENT. A slow integration suite is a suite people stop running, and then
      # delete. The budget is asserted rather than merely reported, so growth has to be argued for by
      # raising this number in a reviewed diff.
      - name: Test (duration-enforced)
        env:
          DURATION_BUDGET_SECONDS: "600"
        run: |
          set -o pipefail
          started=$(date +%s)
          status=0

          # `|| status=$?` rather than a bare invocation: Actions runs this with `bash -e`, so a bare
          # failing command would abort the step here and the duration summary below would never be
          # written -- and `status=$?` would be dead code. Handling the failure explicitly keeps the
          # timing report available on red runs, which is when it is most useful.
          dotnet test AgendaBuddy.IntegrationTests/AgendaBuddy.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-results.trx" || status=$?

          elapsed=$(( $(date +%s) - started ))
          echo "Integration suite took ${elapsed}s (budget ${DURATION_BUDGET_SECONDS}s)."
          {
            echo "### Integration suite"
            echo
            echo "Duration: **${elapsed}s** (budget ${DURATION_BUDGET_SECONDS}s)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          if [ "$elapsed" -gt "$DURATION_BUDGET_SECONDS" ]; then
            echo "::error::Integration suite took ${elapsed}s, over the ${DURATION_BUDGET_SECONDS}s budget."
            echo "::error::Either make it faster or raise DURATION_BUDGET_SECONDS deliberately, in a reviewed change."
            exit 1
          fi

      # F-018-T15 / AC-13: proves Testcontainers' resource reaper (Ryuk) actually cleans up an
      # orphaned container after a real, abnormal SIGKILL of the test process mid-flight — by
      # performing that exact kill and watching what happens, not by trusting documentation of how
      # Ryuk is supposed to behave (the same "reasoned, not observed" trap that made a threat wrong
      # in F-013). Runs in this job specifically because it is the one that already has Docker and
      # a real MongoDB Testcontainer path to kill.
      - name: Verify container reaping after an abnormal kill (F-018-T15)
        run: ./scripts/verify-container-reaping.sh

      # Container-per-class means a leaked container is possible if a fixture throws mid-startup.
      # Reported rather than cleaned up: the runner is ephemeral, so this is a diagnostic, and a
      # non-empty list here means a fixture has a disposal bug worth knowing about.
      - name: Report any surviving containers
        if: always()
        run: docker ps -a --filter "ancestor=mongo:7.0" --format '{{.ID}} {{.Status}}' || true

      - name: Publish integration test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Integration Tests
          path: "**/TestResults/integration-results.trx"
          reporter: dotnet-trx

  # ---------------------------------------------------------------------------
  # Mobile — Android build (runs when AgendaBuddy.MobileApp or shared library changes)
  # ---------------------------------------------------------------------------
  build-android:
    name: "Mobile — Android Build"
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android (Release)
        run: dotnet build AgendaBuddy.MobileApp/AgendaBuddy.MobileApp.csproj /p:MobilePlatform=android -c Release

  # ---------------------------------------------------------------------------
  # Mobile — iOS build (runs when AgendaBuddy.MobileApp or shared library changes)
  # ---------------------------------------------------------------------------
  build-ios:
    name: "Mobile — iOS Build"
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.code == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS (Release)
        run: dotnet build AgendaBuddy.MobileApp/AgendaBuddy.MobileApp.csproj /p:MobilePlatform=ios -c Release

  # ---------------------------------------------------------------------------
  # Mobile — ViewModel / Service unit tests
  # ---------------------------------------------------------------------------
  build-mobile-tests:
    name: "Mobile — Unit Tests"
    needs: changes
    if: needs.changes.outputs.mobile-tests == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test AgendaBuddy.MobileApp (no mobile workloads)
        run: >
          dotnet test AgendaBuddy.MobileApp.Tests/AgendaBuddy.MobileApp.Tests.csproj
          /p:MobileWorkloads=false
          --filter "Category!=Acceptance"
          --collect:"XPlat Code Coverage"

  # ---------------------------------------------------------------------------
  # One check that always reports, whatever the filters decided
  # ---------------------------------------------------------------------------
  # Path filtering means the set of jobs differs per PR, which makes "is CI green?" hard to answer
  # and makes a required-status-check rule impossible to pin to a job that might not run. This job
  # always runs, prints which filters fired, and fails if any job that *did* run failed. Point
  # branch protection at this one.
  summary:
    needs: [changes, build-and-test, security-scan, docker-build-and-scan, integration, build-android, build-ios, build-mobile-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report what ran and why
        env:
          API: ${{ needs.changes.outputs.api }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
          MOBILE_TESTS: ${{ needs.changes.outputs.mobile-tests }}
          DOCKER: ${{ needs.changes.outputs.docker }}
          CODE: ${{ needs.changes.outputs.code }}
          R_BACKEND: ${{ needs.build-and-test.result }}
          R_SECURITY: ${{ needs.security-scan.result }}
          R_DOCKER: ${{ needs.docker-build-and-scan.result }}
          R_INTEGRATION: ${{ needs.integration.result }}
          R_ANDROID: ${{ needs.build-android.result }}
          R_IOS: ${{ needs.build-ios.result }}
          R_MOBILE_TESTS: ${{ needs.build-mobile-tests.result }}
        run: |
          {
            echo "### CI summary"
            echo
            echo "Code-relevant change detected: \`$CODE\` — every build job below also requires this."
            echo
            echo "| Filter | Fired | Job | Result |"
            echo "|---|---|---|---|"
            echo "| api | \`$API\` | build-and-test | \`$R_BACKEND\` |"
            echo "| (always runs) | — | Security — dependency audit | \`$R_SECURITY\` |"
            echo "| api | \`$API\` | Integration (containers) | \`$R_INTEGRATION\` |"
            echo "| docker | \`$DOCKER\` | Docker build+scan (7-service matrix) | \`$R_DOCKER\` |"
            echo "| mobile | \`$MOBILE\` | Android build | \`$R_ANDROID\` |"
            echo "| mobile | \`$MOBILE\` | iOS build | \`$R_IOS\` |"
            echo "| mobile-tests | \`$MOBILE_TESTS\` | Mobile unit tests | \`$R_MOBILE_TESTS\` |"
            echo
            echo "\`skipped\` means no file in that filter's paths changed — not that anything was ignored."
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail-closed guard. An area filter firing while `code` did not means the change touched
          # only non-code files under a code directory — normally documentation, which is exactly
          # what we want skipped. But it would ALSO happen if a genuinely code-relevant extension
          # is missing from the `code` filter, and then the build would skip silently. Make that
          # case loud rather than invisible.
          if [ "$CODE" != "true" ] && { [ "$API" = "true" ] || [ "$MOBILE" = "true" ] || [ "$MOBILE_TESTS" = "true" ] || [ "$DOCKER" = "true" ]; }; then
            {
              echo
              echo "> ⚠️ **Build jobs were skipped because no code-relevant file changed**, even though"
              echo "> an area filter matched. This is expected for documentation inside a code directory"
              echo "> (for example \`AgendaBuddy.Kafka/readme.md\`)."
              echo ">"
              echo "> If this change *did* touch build-relevant files, the \`code\` filter is missing an"
              echo "> extension — add it in the \`changes\` job and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Area filter fired but code == false — build skipped. Verify the 'code' filter covers this change's file types."
          fi

          failed=""
          for pair in "build-and-test:$R_BACKEND" "security-scan:$R_SECURITY" "docker-build-and-scan:$R_DOCKER" "android:$R_ANDROID" "ios:$R_IOS" "mobile-tests:$R_MOBILE_TESTS"; do
            name=${pair%%:*}; result=${pair#*:}
            case "$result" in
              failure|cancelled) failed="$failed $name($result)" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed jobs:$failed"
            exit 1
          fi
          echo "No job failed. Filters — api=$API mobile=$MOBILE mobile-tests=$MOBILE_TESTS"
