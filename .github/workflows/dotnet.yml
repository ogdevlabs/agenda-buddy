name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # Detect which areas of the codebase changed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile-tests: ${{ steps.filter.outputs.mobile-tests }}
      library: ${{ steps.filter.outputs.library }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            library:
              - 'Library/**'
              - 'EventAndCommands/**'
              - 'Directory.Build.props'
            api:
              - 'Library/**'
              - 'EventAndCommands/**'
              - 'Booking/**'
              - 'Calendar/**'
              - 'Customer/**'
              - 'Provider/**'
              - 'Services/**'
              - 'Profession/**'
              - 'Identity/**'
              - 'Kafka/**'
              - '*.Tests/**'
              - '!MobileApp.Tests/**'
              - 'Directory.Build.props'
              - '*.sln'
            mobile:
              - 'MobileApp/**'
              - 'Library/**'
              - 'Directory.Build.props'
            mobile-tests:
              - 'MobileApp/**'
              - 'MobileApp.Tests/**'
              - 'Library/**'
              - 'Directory.Build.props'

  # ---------------------------------------------------------------------------
  # API services — build + test (runs when backend or shared library changes)
  # ---------------------------------------------------------------------------
  build-and-test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore /p:MobileWorkloads=false

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:MobileWorkloads=false

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "Category!=Acceptance"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Mobile — Android build (runs when MobileApp or shared library changes)
  # ---------------------------------------------------------------------------
  build-android:
    name: "Mobile — Android Build"
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android (Release)
        run: dotnet build MobileApp/MobileApp.csproj /p:MobilePlatform=android -c Release

  # ---------------------------------------------------------------------------
  # Mobile — iOS build (runs when MobileApp or shared library changes)
  # ---------------------------------------------------------------------------
  build-ios:
    name: "Mobile — iOS Build"
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS (Release)
        run: dotnet build MobileApp/MobileApp.csproj /p:MobilePlatform=ios -c Release

  # ---------------------------------------------------------------------------
  # Mobile — ViewModel / Service unit tests
  # ---------------------------------------------------------------------------
  build-mobile-tests:
    name: "Mobile — Unit Tests"
    needs: changes
    if: needs.changes.outputs.mobile-tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test MobileApp (no mobile workloads)
        run: >
          dotnet test MobileApp.Tests/MobileApp.Tests.csproj
          /p:MobileWorkloads=false
          --filter "Category!=Acceptance"
          --collect:"XPlat Code Coverage"
