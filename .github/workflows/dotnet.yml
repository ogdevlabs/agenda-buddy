name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore /p:MobileWorkloads=false

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:MobileWorkloads=false

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Mobile builds — build verification only (v1).
  # No code signing, no App Store upload. These jobs are independent of the
  # main .NET backend build and do not block each other.
  # ---------------------------------------------------------------------------

  build-android:
    name: "Mobile — Android Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore MobileApp dependencies
        run: dotnet restore MobileApp/MobileApp.csproj -p:TargetFramework=net10.0-android

      # Build-only — no code signing or APK upload for CI v1
      - name: Build Android (Release)
        run: dotnet build MobileApp/MobileApp.csproj -f net10.0-android -c Release --no-restore

  build-ios:
    name: "Mobile — iOS Build"
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore MobileApp dependencies
        run: dotnet restore MobileApp/MobileApp.csproj -p:TargetFramework=net10.0-ios

      # macOS runner required for Xcode toolchain.
      # Build-only — no code signing or App Store upload for CI v1
      # (PRD Known Risk: code signing deferred to a future milestone).
      - name: Build iOS (Release)
        run: dotnet build MobileApp/MobileApp.csproj -f net10.0-ios -c Release --no-restore

  build-mobile-tests:
    name: "Mobile — ViewModel / Service Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MobileApp.Tests dependencies
        run: dotnet restore MobileApp.Tests/MobileApp.Tests.csproj /p:MobileWorkloads=false

      # Run unit tests without mobile workloads — exercises ViewModels and
      # service logic that does not require a device or MAUI runtime.
      - name: Test MobileApp (no mobile workloads)
        run: >
          dotnet test MobileApp.Tests/MobileApp.Tests.csproj
          /p:MobileWorkloads=false
          --collect:"XPlat Code Coverage"
