name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore /p:MobileWorkloads=false

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:MobileWorkloads=false

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Mobile builds — build verification only (v1).
  # No code signing, no App Store upload. These jobs are independent of the
  # main .NET backend build and do not block each other.
  # ---------------------------------------------------------------------------

  build-android:
    name: "Mobile — Android Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Restore Library and other non-MAUI dependencies first (they target net10.0)
      - name: Restore non-MAUI projects
        run: dotnet restore /p:MobileWorkloads=false

      # /p:TargetFrameworks overrides the multi-TFM list so only android is restored+built,
      # preventing NETSDK1178 from the iOS SDK not being installed on this ubuntu runner.
      - name: Build Android (Release)
        run: dotnet build MobileApp/MobileApp.csproj /p:TargetFrameworks=net10.0-android -c Release --no-restore

  build-ios:
    name: "Mobile — iOS Build"
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # Restore Library and other non-MAUI dependencies first (they target net10.0)
      - name: Restore non-MAUI projects
        run: dotnet restore /p:MobileWorkloads=false

      # macOS runner required for Xcode toolchain. Build-only — no code signing (PRD Known Risk).
      # /p:TargetFrameworks overrides the multi-TFM list so only ios is restored+built,
      # preventing NETSDK1147 from the Android workload not being installed on this macos runner.
      - name: Build iOS (Release)
        run: dotnet build MobileApp/MobileApp.csproj /p:TargetFrameworks=net10.0-ios -c Release --no-restore

  build-mobile-tests:
    name: "Mobile — ViewModel / Service Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # dotnet test handles restore implicitly; /p:MobileWorkloads=false scopes MobileApp
      # to net10.0 only so no MAUI workload is required on this runner.
      - name: Test MobileApp (no mobile workloads)
        run: >
          dotnet test MobileApp.Tests/MobileApp.Tests.csproj
          /p:MobileWorkloads=false
          --collect:"XPlat Code Coverage"
