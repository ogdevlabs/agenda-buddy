name: iOS — archive, sign, upload to App Store Connect

# Dispatch only. Nothing about this should happen on a push: an upload is visible to Apple and
# consumes a build number that App Store Connect will never accept twice.
#
# Produces a signed .ipa and sends it to App Store Connect, where it appears under TestFlight once
# Apple finishes processing (usually 5-15 minutes after upload). It does NOT submit for review.

on:
  workflow_dispatch:
    inputs:
      submit_note:
        description: "Optional note recorded in the run summary (e.g. what this build is for)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # Names every missing value at once rather than failing on whichever is read first. The same
      # preflight shape as deploy.yml, added there after a half-configured environment wasted a run.
      - name: Preflight — required secrets are present
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
        run: |
          missing=""
          for name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_API_PRIVATE_KEY \
                      IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
                      IOS_PROVISIONING_PROFILE_BASE64 IOS_CODESIGN_KEY; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "All seven secrets present."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # A throwaway keychain, not the runner's login keychain: it is deleted in the final step even
      # when the build fails, so a private key never outlives the job. Verified locally against the
      # real .p12 -- this exact sequence yields "1 valid identities found".
      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign triggers a GUI authorisation prompt that cannot be answered on a
          # runner, and the build hangs until the job times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Prepended, not replacing: the login keychain still supplies Apple's root certificates, so
          # dropping it here would break chain validation. Collected into an array so each existing
          # keychain is passed as its own argument without relying on word splitting.
          existing=()
          while IFS= read -r kc; do
            kc=$(printf '%s' "$kc" | tr -d '"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -n "$kc" ] && existing+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"

          rm -f "$RUNNER_TEMP/distribution.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # The directory Xcode and the .NET iOS targets look in. It does not exist on a fresh runner.
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          echo "$PROFILE_BASE64" | base64 --decode > "$dir/Agendame_App_Store.mobileprovision"
          security cms -D -i "$dir/Agendame_App_Store.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist"

      # MANDATORY, not hygiene. The .NET iOS targets cache the merged Info.plist in obj/, so an
      # incremental build can ship a bundle with the PREVIOUS UIDeviceFamily, orientations and App
      # Transport Security settings while the source file and every test are correct. Observed live:
      # after the plist was corrected, the built .app still contained UIDeviceFamily [1,2], landscape
      # and the localhost ATS exception until obj and bin were removed.
      - name: Clean obj and bin so the plist cannot be stale
        run: rm -rf AgendaBuddy.MobileApp/obj AgendaBuddy.MobileApp/bin

      - name: Archive and sign
        env:
          CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
        run: |
          set -euo pipefail
          # BuildNumber comes from the run number: App Store Connect permanently refuses a build number
          # it has already accepted, so a fixed value makes the second upload fail.
          # MobilePlatform=ios is required, not a shortcut. Restore evaluates every entry in
          # TargetFrameworks regardless of -f, so without it the runner is asked for the android
          # workload as well and fails NETSDK1147 -- only maui-ios is installed here, deliberately.
          # The property collapses TargetFrameworks to net10.0-ios alone (verified with
          # `dotnet msbuild -getProperty:TargetFrameworks`).
          dotnet publish AgendaBuddy.MobileApp/AgendaBuddy.MobileApp.csproj \
            -c Release -f net10.0-ios \
            -p:MobilePlatform=ios \
            -p:IosSigned=true \
            -p:BuildNumber="${{ github.run_number }}" \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="Agendame App Store" \
            -p:ArchiveOnBuild=true

      - name: Locate the .ipa
        run: |
          set -euo pipefail
          ipa=$(find AgendaBuddy.MobileApp/bin -name "*.ipa" -print -quit)
          if [ -z "$ipa" ]; then
            echo "::error::No .ipa produced. The archive step succeeded but emitted nothing to upload."
            find AgendaBuddy.MobileApp/bin -maxdepth 4 -type d -name "*.xcarchive" -o -maxdepth 4 -name "*.app" | head
            exit 1
          fi
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          echo "Found $ipa ($(du -h "$ipa" | cut -f1))"

      # Validated before uploading, because altool reports most rejections (wrong bundle id, missing
      # icon, bad entitlements) at validation and a failed upload still burns the build number.
      - name: Validate with App Store Connect
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          printf '%s' "$P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Upload to App Store Connect
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          {
            echo "### Uploaded to App Store Connect"
            echo
            echo "- build number: \`${{ github.run_number }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            [ -n "${{ inputs.submit_note }}" ] && echo "- note: ${{ inputs.submit_note }}"
            echo
            echo "Apple processes the build before it appears in TestFlight, usually 5-15 minutes."
            echo "This workflow does NOT submit for review."
          } >> "$GITHUB_STEP_SUMMARY"

      # always(): the private key must not survive the job even when the archive or upload failed.
      - name: Remove the signing keychain and API key
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}" 2>/dev/null || true
          rm -f "$HOME/private_keys/"*.p8 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/Agendame_App_Store.mobileprovision" 2>/dev/null || true
          echo "cleaned up"
