title = "agenda-buddy gitleaks config"

# Extends gitleaks' default ruleset rather than replacing it — losing the built-in rules (AWS keys,
# GitHub tokens, Stripe keys, etc.) to gain one custom rule would be a net loss of coverage.
[extend]
useDefault = true

# F-017-T05. The default ruleset does not recognize a MongoDB/Atlas connection string with
# embedded credentials as a secret (verified: it misses the exact shape of the credential this
# project already leaked once — ISSUE-002). This rule closes that gap.
#
# `secretGroup = 2` is deliberate, not cosmetic: without it, gitleaks' `--redact` flag (which
# gitleaks-action always passes — verified against gitleaks-action's own source) redacts whatever
# the FIRST capture group matches. Group 1 here is the optional `+srv` scheme suffix, not the
# password — so an unset secretGroup redacts "+srv" and leaves the real password sitting in plain
# text in both the console "Finding:" line and the SARIF report's snippet, in every log a scan step
# fails in. Group 2 (the password) is what must be redacted. See F-017-T05's canary verification
# script (scripts/verify-gitleaks-canary.sh) for the empirical proof this matters.
[[rules]]
id = "mongodb-atlas-connection-string"
description = "MongoDB/Atlas connection string with embedded credentials (the shape of the ISSUE-002 leaked credential)"
regex = '''mongodb(\+srv)?:\/\/[A-Za-z0-9_\-\.]+:([^@\s\/]+)@[A-Za-z0-9_\-\.]+\.mongodb\.net[^\s'"]*'''
secretGroup = 2
tags = ["secret", "mongodb", "atlas"]

# Firebase per-app client configuration is NOT a secret, and the default ruleset cannot tell the
# difference. `google-services.json` (Android) and `GoogleService-Info.plist` (iOS) each carry an
# `api_key`/`API_KEY` that gitleaks matches as `gcp-api-key`, but Google publishes these as CLIENT
# configuration: they ship inside every APK and every .ipa, so anyone who has the app already has them.
# They are scoped by package name plus signing certificate rather than by secrecy, and they contain no
# private key. The credential that can actually send a message is the service-account JSON, which lives
# in user secrets / an Aspire secret parameter and is never committed.
#
# A GLOBAL path allowlist, not a per-rule one: gitleaks 8 cannot attach an allowlist to a rule inherited
# via `extend.useDefault` (declaring `[[rules]] id = "gcp-api-key"` redefines the rule instead, and a
# redefinition with no regex is silently ineffective -- verified, it still reported the finding). So this
# exempts these two paths from EVERY rule, which is wider than ideal. Accepted because both files are
# generated by the Firebase console and never hand-edited, so nothing else lands in them; the mitigation
# is that the paths are two exact filenames, so a secret committed anywhere else -- including elsewhere
# under Platforms/ -- is still caught. scripts/verify-gitleaks-canary.sh proves the scanner still works.
[allowlist]
description = "Firebase client config files - published inside the app package by design, not secrets"
paths = [
    'AgendaBuddy\.MobileApp/Platforms/Android/google-services\.json',
    'AgendaBuddy\.MobileApp/Platforms/iOS/GoogleService-Info\.plist',
]
