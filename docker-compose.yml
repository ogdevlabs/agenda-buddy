name: agenda-buddy-solution

services:
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    # ports:
    #   - 8080:8080
    depends_on:
      - kafka0
      - schema-registry
      - broker
    # environment:
    #   KAFKA_CLUSTERS_0_NAME: local
    #   KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    #   KAFKA_CLUSTERS_0_METRICS_PORT: 9101
    #   KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8181
    #   DYNAMIC_CONFIG_ENABLED: 'true'  # not necessary, added for tests
    #   KAFKA_CLUSTERS_0_AUDIT_TOPICAUDITENABLED: 'true'
    #   KAFKA_CLUSTERS_0_AUDIT_CONSOLEAUDITENABLED: 'true'
      
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    hostname: zookeeper
    container_name: zookeeper
    # ports:
    #   - "2181:2181"
    # environment:
    #   ZOOKEEPER_CLIENT_PORT: 2181
    #   ZOOKEEPER_TICK_TIME: 2000
  
  broker:
    image: confluentinc/cp-server:7.2.1
    hostname: broker
    container_name: broker
    depends_on:
      - zookeeper
    # ports:
    #   - "9092:9092"
    #   - "9101:9101"
    # environment:
    #   KAFKA_BROKER_ID: 1
    #   KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
    #   KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    #   KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
    #   KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
    #   KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    #   KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    #   KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
    #   KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
    #   KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    #   KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    #   KAFKA_JMX_PORT: 9101
    #   KAFKA_JMX_HOSTNAME: localhost
    #   KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    #   CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
    #   CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
    #   CONFLUENT_METRICS_ENABLE: 'true'
    #   CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
    # healthcheck:
    #   test: ["CMD", "kafka-topics", "--bootstrap-server", "broker:9092", "--list"]
    #   interval: 10s
    #   timeout: 15s
    #   retries: 15
  
  schema-registry:
    image: confluentinc/cp-schema-registry:7.2.1
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    # ports:
    #   - "8081:8081"
    # environment:
    #   SCHEMA_REGISTRY_HOST_NAME: schema-registry
    #   SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
    #   SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
  
  kafka0:
    image: confluentinc/cp-kafka:7.2.1
    hostname: kafka0
    container_name: kafka0
    # command: ["tail", "-f", "/dev/null"]
    # network_mode: "host"

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.2.1
    # volumes:
    #    - ./compose/data/message.json:/data/message.json
    depends_on:
      - kafka0
    # command: "bash -c 'echo Waiting for Kafka to be ready... && \
    #            cub kafka-ready -b broker:29092 1 30 && \
    #            kafka-topics --create --topic agenda-buddy-topic --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server broker:29092 && \
    #            kafka-console-producer --bootstrap-server broker:29092 --topic agenda-buddy-topic < /data/message.json'"
  
  provider-db:
    image: postgres:latest
  
  provider:
    hostname: provider
    container_name: provider
    image: ${DOCKER_REGISTRY-}provider
    build:
      context: .
      dockerfile: Provider/Dockerfile
    depends_on:
      - provider-db